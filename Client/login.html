<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatMuch Login</title>
</head>
<body>
    <main>
        <h1>ChatMuch</h1>
        <p>Sign in or create an account to load the campus feed from the FastAPI backend.</p>

        <section>
            <h2>Login</h2>
            <form id="loginForm">
                <label for="loginEmail">Email</label><br>
                <input id="loginEmail" type="email" required><br><br>

                <label for="loginPassword">Password</label><br>
                <input id="loginPassword" type="password" required><br><br>

                <button type="submit">Sign In</button>
            </form>
            <p id="loginStatus"></p>
        </section>

        <section>
            <h2>Register</h2>
            <form id="registerForm">
                <label for="registerEmail">Email</label><br>
                <input id="registerEmail" type="email" required><br><br>

                <label for="registerUsername">Username</label><br>
                <input id="registerUsername" type="text" minlength="3" required><br><br>

                <label for="registerDisplayName">Display Name</label><br>
                <input id="registerDisplayName" type="text"><br><br>

                <label for="registerCampus">Campus</label><br>
                <select id="registerCampus" required></select><br><br>

                <label for="registerPassword">Password</label><br>
                <input id="registerPassword" type="password" minlength="8" required><br><br>

                <button type="submit">Create Account</button>
            </form>
            <p id="registerStatus"></p>
        </section>
    </main>

    <script src="/js/global.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
